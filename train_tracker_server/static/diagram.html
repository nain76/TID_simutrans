<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>列車位置ダイアグラム - Train Position Diagram</title>
    <link rel="stylesheet" href="/static/diagram.css">
</head>
<body>
    <div class="main-container">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <h1>🚆 列車位置ダイアグラム</h1>
                <div class="game-info">
                    <span id="game-time">ゲーム時刻: --</span>
                    <span class="separator">|</span>
                    <span id="last-update">最終更新: --</span>
                    <span class="separator">|</span>
                    <span id="connection-status" class="status-connected">接続中</span>
                </div>
            </div>
            <div class="header-right">
                <button id="refresh-btn" class="btn-primary">手動更新</button>
                <a href="/" class="btn-secondary">テーブル表示に戻る</a>
            </div>
        </header>

        <div class="content-wrapper">
            <!-- Sidebar -->
            <aside class="sidebar">
                <div class="sidebar-section">
                    <h3>フィルター</h3>
                    <label style="display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: #6b7280;">会社</label>
                    <select id="filter-company" style="width: 100%; padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 4px; margin-bottom: 1rem;">
                        <option value="">全ての会社</option>
                    </select>

                    <label style="display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: #6b7280;">路線名検索</label>
                    <input type="text" id="search-line" placeholder="路線名で検索..." style="width: 100%; padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 4px; margin-bottom: 1rem;">
                </div>

                <div class="sidebar-section">
                    <h3>路線選択</h3>
                    <div class="filter-actions" style="display: flex; gap: 0.5rem; margin-bottom: 0.5rem;">
                        <button onclick="selectAllLines()" class="btn-small" style="flex: 1; padding: 0.4rem; font-size: 0.85rem;">全選択</button>
                        <button onclick="deselectAllLines()" class="btn-small" style="flex: 1; padding: 0.4rem; font-size: 0.85rem;">全解除</button>
                    </div>
                    <div id="line-selector" class="line-selector">
                        <p class="loading-text">路線データ読み込み中...</p>
                    </div>
                </div>

                <div class="sidebar-section">
                    <h3>表示設定</h3>
                    <label class="checkbox-label">
                        <input type="checkbox" id="show-tracks" checked>
                        線路を表示
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="show-station-names" checked>
                        駅名を表示
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="show-train-names" checked>
                        列車名を表示
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="show-speeds" checked>
                        速度を表示
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="auto-layout" checked>
                        自動レイアウト
                    </label>
                </div>

                <div class="sidebar-section">
                    <h3>統計情報</h3>
                    <div class="stats">
                        <div class="stat-item">
                            <span class="stat-label">表示路線数:</span>
                            <span id="stat-lines" class="stat-value">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">表示列車数:</span>
                            <span id="stat-trains" class="stat-value">0</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-label">駅数:</span>
                            <span id="stat-stations" class="stat-value">0</span>
                        </div>
                    </div>
                </div>

                <div class="sidebar-section">
                    <h3>ヘルプ</h3>
                    <div class="help-text">
                        <p><strong>操作方法:</strong></p>
                        <p>• マウスドラッグ: 表示領域の移動</p>
                        <p>• マウスホイール: ズーム</p>
                        <p>• +/-ボタン: ズーム</p>
                        <p>• 1:1ボタン: 表示をリセット</p>
                        <p><strong>表示:</strong></p>
                        <p>• 赤い三角: 通常運行中の列車</p>
                        <p>• 黄色い三角: 停車中の列車</p>
                        <p><strong>データ更新:</strong></p>
                        <p>• 列車位置: 5秒ごとに自動更新</p>
                        <p>• 駅データ: 2日ごとにエクスポート</p>
                    </div>
                </div>
            </aside>

            <!-- Main Diagram Area -->
            <main class="diagram-container">
                <!-- Zoom Controls -->
                <div class="zoom-controls">
                    <button onclick="zoomIn()" class="zoom-btn" title="拡大">+</button>
                    <button onclick="resetZoom()" class="zoom-btn" title="リセット">1:1</button>
                    <button onclick="zoomOut()" class="zoom-btn" title="縮小">-</button>
                    <span id="zoom-level" class="zoom-level">100%</span>
                </div>
                <div id="diagram-wrapper" class="diagram-wrapper">
                    <svg id="railroad-diagram" class="railroad-diagram" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <!-- Marker for train direction -->
                            <marker id="train-arrow" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
                                <path d="M0,0 L0,6 L9,3 z" fill="#f00" />
                            </marker>

                            <!-- Station marker -->
                            <circle id="station-marker" r="6" fill="#2c3e50" stroke="#fff" stroke-width="2"/>
                        </defs>

                        <!-- Diagram content will be generated here -->
                        <g id="diagram-content">
                            <text x="400" y="300" text-anchor="middle" class="no-data-message">
                                路線を選択してください
                            </text>
                        </g>
                    </svg>
                </div>
            </main>
        </div>
    </div>

    <script src="/static/diagram.js"></script>
</body>
</html>
